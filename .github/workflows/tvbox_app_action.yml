name: 编译tvbox

on:
  schedule:
    - cron: 0 20 * * *
  workflow_dispatch:
    inputs:
      rebuild:
        description: '忽略构建记录以重新构建'
        required: false
        type: boolean
        default: true
      donotpublish:
        description: '构建后不提交发布新版'
        required: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - userName: q215613905
            repoName: TVBoxOS
            branchName: main
            jdkVersion: 17
          - userName: takagen99
            repoName: Box
            branchName: main
            jdkVersion: 17
          - userName: mlabalabala
            repoName: box
            branchName: main
            jdkVersion: 11

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check New Commit
        run: |
          upStream=https://github.com/${{ matrix.userName }}/${{ matrix.repoName }}
          echo "upStream=$upStream" >> $GITHUB_ENV
          
          # 通过 GitHub API 查询分支最新 commit
          commit=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ matrix.userName }}/${{ matrix.repoName }}/commits/${{ matrix.branchName }}" \
            | jq -r '.sha // empty')
            
          # 如果 API 获取异常，采用 HTML 解析备选
          if [[ ! "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
            commit=$(curl -sL $upStream/commits/${{ matrix.branchName }} | grep -o "/${{ matrix.userName }}/${{ matrix.repoName }}/commit/[a-z0-9]\+" | head -1 | cut -d\/ -f5)
          fi
          
          if [[ ! "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "错误: 无法获取 ${{ matrix.userName }}/${{ matrix.repoName }} 分支 ${{ matrix.branchName }} 的有效 commit!"
            exit 1
          fi
          
          # 判断是否需要构建：有新 commit、手动触发 (workflow_dispatch) 或显式勾选 rebuild
          should_build="false"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "${{ inputs.rebuild }}" == "true" ] || ! grep -q "${commit:0:7}" README.md; then
            should_build="true"
          fi
          
          if [ "$should_build" == "true" ]; then
            echo "commit=$commit" >> $GITHUB_ENV
            echo "commitS=${commit:0:7}" >> $GITHUB_ENV
            echo "触发构建，commit=$commit (${commit:0:7})"
          else
            echo "未检测到新提交且未指定重建，跳过构建。"
          fi

      - name: Checkout Source Code
        if: ${{ env.commit }}
        run: |
          git clone ${{ env.upStream }} TVBoxOSC
          cd TVBoxOSC
          git checkout ${{ env.commit }}
          echo "tag=$(git log --date=format:'%Y%m%d-%H%M' --pretty=format:%cd -1 ${{ env.commitS }})" >> $GITHUB_ENV

      - name: Setup Python 3.10
        if: ${{ env.commit }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Prepare Code
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          # 1. 修复 jitpack 仓库配置
          sed -i "s/maven { url 'https:\/\/jitpack.io' }/maven { url 'https:\/\/jitpack.io' \n content { includeGroupByRegex(\"com\\\\.github\\\\..*\") } }/g" settings.gradle 2>/dev/null || true
          
          # 2. 补全缺失类文件
          missing_files=(
            "app/src/main/java/com/fongmi/android/tv/api/decoder/DataDecoder.java"
            "app/src/main/java/com/fongmi/android/tv/api/decoder/HeaderDecoder.java"
            "app/src/main/java/com/fongmi/android/tv/api/decoder/JsonDecoder.java"
          )
          for file in "${missing_files[@]}"; do
            if [ ! -f "$file" ]; then
              mkdir -p "$(dirname "$file")"
              touch "$file"
            fi
          done

          # 3. 替换依赖版本以保证构建兼容性
          if [ -f "gradle/libs.versions.toml" ]; then
            sed -i 's/media3 = ".*"/media3 = "1.8.0"/' gradle/libs.versions.toml 2>/dev/null || true
            sed -i 's/room = ".*"/room = "2.6.1"/' gradle/libs.versions.toml 2>/dev/null || true
            sed -i 's/activity = ".*"/activity = "1.9.3"/' gradle/libs.versions.toml 2>/dev/null || true
            sed -i 's/annotation = ".*"/annotation = "1.9.1"/' gradle/libs.versions.toml 2>/dev/null || true
            sed -i 's/appcompat = ".*"/appcompat = "1.7.0"/' gradle/libs.versions.toml 2>/dev/null || true
            sed -i 's/biometric = ".*"/biometric = "1.1.0"/' gradle/libs.versions.toml 2>/dev/null || true
            sed -i 's/core = ".*"/core = "1.15.0"/' gradle/libs.versions.toml 2>/dev/null || true
            sed -i 's/fragment = ".*"/fragment = "1.8.5"/' gradle/libs.versions.toml 2>/dev/null || true
            sed -i 's/lifecycle = ".*"/lifecycle = "2.8.7"/' gradle/libs.versions.toml 2>/dev/null || true
            sed -i 's/preference = ".*"/preference = "1.2.1"/' gradle/libs.versions.toml 2>/dev/null || true
          fi

          # 4. 处理 chaquo 模块
          if [ -f "chaquo/build.gradle" ]; then
            sed -i 's/\(com.chaquo.python:gradle:\)[0-9.]\+/\115.0.1/g' build.gradle 2>/dev/null || true
            sed -i 's/minSdkVersion 19/minSdkVersion 21/g' chaquo/build.gradle 2>/dev/null || true
            sed -i 's/minSdkVersion 19/minSdkVersion 21/g' app/build.gradle 2>/dev/null || true
          fi

          # 5. 移除 x86 架构
          if [ -f "app/build.gradle" ]; then
            sed -i '/x86 {/,/^[[:space:]]*}/d' app/build.gradle 2>/dev/null || true
            sed -i 's/applicationId "com\.fongmi\.android\.tv"/applicationId "com.fongmi.tv"/' app/build.gradle 2>/dev/null || true
          fi

          # 6. 修改 AndroidManifest.xml Provider
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:authorities="com\.fongmi\.quickjs\.provider"/android:authorities="${applicationId}.quickjs.provider"/' app/src/main/AndroidManifest.xml 2>/dev/null || true
          fi

      - name: Compress Source Code
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          tar -cJf source-${{ env.commitS }}.tar.xz --exclude=.git --exclude=.github *

      - name: Release Apk Sign
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          cp -f ${{ github.workspace }}/.github/workflows/TVBoxOSC.jks app/TVBoxOSC.jks
          signingConfigs=''
          signingConfig='ICAgICAgICAgICAgaWYgKHByb2plY3QuaGFzUHJvcGVydHkoIlJFTEVBU0VfU1RPUkVfRklMRSIpKSB7XAogICAgICAgICAgICAgICAgc2lnbmluZ0NvbmZpZyA9IHNpZ25pbmdDb25maWdzLm15Q29uZmlnXAogICAgICAgICAgICB9XAo='
          signingConfigs="$(echo "$signingConfigs" |base64 -d )"
          signingConfig="$(echo "$signingConfig" |base64 -d )"
          sed -i -e "/defaultConfig {/i\\$signingConfigs " -e "/debug {/a\\$signingConfig " -e "/release {/a\\$signingConfig " app/build.gradle
          sed -i '$a\RELEASE_STORE_FILE=./TVBoxOSC.jks'     ./gradle.properties
          sed -i '$a\RELEASE_KEY_ALIAS=TVBoxOSC'            ./gradle.properties
          sed -i '$a\RELEASE_STORE_PASSWORD=TVBoxOSC'       ./gradle.properties
          sed -i '$a\RELEASE_KEY_PASSWORD=TVBoxOSC'         ./gradle.properties

      - name: Setup JDK
        if: ${{ env.commit }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdkVersion }}

      - name: Setup Gradle
        if: ${{ env.commit }}
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build With Gradle
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          chmod +x gradlew
          printf '\n' >> gradle.properties
          for prop in "org.gradle.daemon=true" "org.gradle.parallel=true" "org.gradle.caching=true"; do
            key="${prop%%=*}"
            if grep -q "^${key}=" gradle.properties; then
              sed -i "s|^${key}=.*|${prop}|" gradle.properties
            else
              echo "${prop}" >> gradle.properties
            fi
          done
          ./gradlew assemblerelease --build-cache --parallel --daemon --warning-mode all

      - name: Prepare App
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          rm -rf apk/
          mkdir -p apk/
          find . -type f \( -name "*release*.apk" -o -name "*Release*.apk" \) | while IFS= read -r file; do
            base=$(basename "$file")
            cp "$file" "apk/${{ matrix.userName }}-${{ matrix.repoName }}-${{ matrix.branchName }}-${base}"
          done

      - name: Release Note
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          lastCommit=$(grep "${{ matrix.userName }}\/${{ matrix.repoName }}" ${{ github.workspace }}/README.md | grep -o '[a-z0-9]\{40\}' | head -1)
          if [ -z "$lastCommit" ]; then
            lastCommit=${{ env.commit }}
          fi
          
          export LESSCHARSET=utf-8
          mkdir -p apk/
          echo -e "Credit: [${{ matrix.userName }}](${{ env.upStream }})\nCommit: ${{ env.commit }}\nChangelog:\n\`\`\`" > apk/${{ matrix.userName }}-Release.log
          if [ "${{ env.commit }}" == "${lastCommit}" ]; then
            git log --pretty=format:%B ${{ env.commitS }} -1 | sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' | cat -n | sort -k2,2 -k1,1n | uniq -f1 | sort -k1,1n | cut -f2- >> apk/${{ matrix.userName }}-Release.log
          else
            git log --pretty=format:%B ${{ env.commitS }}...${lastCommit:0:7} | sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' | cat -n | sort -k2,2 -k1,1n | uniq -f1 | sort -k1,1n | cut -f2- >> apk/${{ matrix.userName }}-Release.log
          fi
          echo -e '```' >> apk/${{ matrix.userName }}-Release.log
          if [ ! -s "apk/${{ matrix.userName }}-Release.log" ]; then
            echo "No changes found" >> apk/${{ matrix.userName }}-Release.log
          fi

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        if: ${{ env.commit }}
        with:
          name: ${{ matrix.userName }}-${{ matrix.repoName }}-${{ matrix.branchName }}
          path: |
            TVBoxOSC/apk/*

      - name: Release and Upload Assets
        uses: ncipollo/release-action@v1
        if: ${{ env.commit && !inputs.donotpublish }}
        with:
          name: ${{ matrix.userName }}_${{ matrix.repoName }}_${{ matrix.branchName }}_${{ env.tag }}
          tag: ${{ matrix.userName }}_${{ matrix.repoName }}_${{ matrix.branchName }}_${{ env.tag }}
          bodyFile: TVBoxOSC/apk/${{ matrix.userName }}-Release.log
          allowUpdates: true
          removeArtifacts: false
          artifacts: |
            TVBoxOSC/apk/*.apk
            TVBoxOSC/source-${{ env.commitS }}.*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Older Releases
        uses: dev-drprasad/delete-older-releases@master
        if: ${{ env.commit && !inputs.donotpublish }}
        with:
          keep_latest: 5
          delete_tags: true
          delete_tag_pattern: ${{ matrix.userName }}_${{ matrix.repoName }}_${{ matrix.branchName }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to master
        if: ${{ env.commit }}
        run: |
          rm -rf TVBoxOSC
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git pull --rebase origin master
          
          # 通过 Python 精确更新 README.md 表格
          python3 - << 'PYEOF'
          import re, os
          from datetime import datetime, timezone, timedelta

          tz = timezone(timedelta(hours=8))
          now = datetime.now(tz).strftime('%Y-%m-%d %H:%M:%S')

          user = "${{ matrix.userName }}"
          repo = "${{ matrix.repoName }}"
          branch = "${{ matrix.branchName }}"
          commit = "${{ env.commit }}"
          short_commit = commit[:7] + "..." if len(commit) >= 7 else commit

          readme_path = "README.md"
          if os.path.exists(readme_path):
              with open(readme_path, "r", encoding="utf-8") as f:
                  lines = f.readlines()

              new_lines = []
              for line in lines:
                  if f"{user}/{repo}" in line and "|" in line:
                      parts = [p.strip() for p in line.split("|")]
                      if len(parts) >= 5:
                          parts[2] = branch
                          parts[3] = short_commit
                          parts[4] = now
                          line = f"| {' | '.join(parts[1:5])} |\n"
                  elif line.startswith("*同步数据更新于:"):
                      line = f"*同步数据更新于: {now}*\n"
                  new_lines.append(line)

              with open(readme_path, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)
              print(f"已更新 README 表格: {user}/{repo} -> {short_commit} at {now}")
          PYEOF
          
          git add --all
          if git diff --staged --quiet; then
            echo "没有变动需要提交"
          else
            git commit -m "Update ${{ matrix.userName }}/${{ matrix.repoName }} to ${{ env.commitS }}"
            git push origin master
          fi

  clean:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 5
