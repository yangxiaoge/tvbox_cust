name: 编译tvbox

on:
  schedule:
    - cron: 0 20 * * *
  workflow_dispatch:
    inputs:
      rebuild:
        description: '忽略构建记录以重新构建'
        required: false
        type: boolean
        default: true
      donotpublish:
        description: '构建后不提交发布新版'
        required: false
        type: boolean
      fongmi_app_name:
        description: '指定要构建的 FongMi 应用名称（如：蜂蜜影视, 影视TV）'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - userName: FongMi
            repoName: TV
            branchName: fongmi
            jdkVersion: 17
          - userName: q215613905
            repoName: TVBoxOS
            branchName: main
            jdkVersion: 17
          - userName: takagen99
            repoName: Box
            branchName: main
            jdkVersion: 17
          - userName: mlabalabala
            repoName: box
            branchName: main
            jdkVersion: 11

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check New Commit
        run: |
          upStream=https://github.com/${{ matrix.userName }}/${{ matrix.repoName }}
          echo "upStream=$upStream" >> $GITHUB_ENV
          
          # 通过 GitHub API 查询分支最新 commit
          commit=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ matrix.userName }}/${{ matrix.repoName }}/commits/${{ matrix.branchName }}" \
            | jq -r '.sha // empty')
            
          # 如果 API 获取异常，采用 HTML 解析备选
          if [[ ! "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
            commit=$(curl -sL $upStream/commits/${{ matrix.branchName }} | grep -o "/${{ matrix.userName }}/${{ matrix.repoName }}/commit/[a-z0-9]\+" | head -1 | cut -d\/ -f5)
          fi
          
          if [[ ! "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "错误: 无法获取 ${{ matrix.userName }}/${{ matrix.repoName }} 分支 ${{ matrix.branchName }} 的有效 commit!"
            exit 1
          fi
          
          # 判断是否需要构建：有新 commit、手动触发 (workflow_dispatch) 或显式勾选 rebuild
          should_build="false"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "${{ inputs.rebuild }}" == "true" ] || ! grep -q "${commit:0:7}" README.md; then
            should_build="true"
          fi
          
          if [ "$should_build" == "true" ]; then
            echo "commit=$commit" >> $GITHUB_ENV
            echo "commitS=${commit:0:7}" >> $GITHUB_ENV
            echo "触发构建，commit=$commit (${commit:0:7})"
          else
            echo "未检测到新提交且未指定重建，跳过构建。"
          fi

      - name: Checkout Source Code
        if: ${{ env.commit }}
        run: |
          git clone ${{ env.upStream }} TVBoxOSC
          cd TVBoxOSC
          git checkout ${{ env.commit }}
          echo "tag=$(git log --date=format:'%Y%m%d-%H%M' --pretty=format:%cd -1 ${{ env.commitS }})" >> $GITHUB_ENV

      - name: Setup Python 3.10
        if: ${{ env.commit }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        if: ${{ env.commit }}
        run: |
          python -m pip install --upgrade pip
          pip install lxml ujson "pyquery<=2.0.0" requests jsonpath cachetools pycryptodome beautifulsoup4 "cssselect<=1.2.0"

      - name: Extra Modify
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          # 1. crosswalk 镜像源防挂
          if [ -f "build.gradle" ]; then
            if grep -q 'crosswalk' build.gradle; then
              sed -i "/crosswalk/a\        maven { url 'https://o0halflife0o.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
            elif grep -q 'jitpack.io' build.gradle; then
              sed -i "/jitpack.io/a\        maven { url 'https://o0halflife0o.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
            fi
          fi

          # 2. 修复 pyquery 和 cssselect 在 Chaquopy 依赖解析中的版本冲突
          find . -name "build.gradle" -exec sed -i 's/install "pyquery"/install "cssselect<=1.2.0"\n            install "pyquery<=2.0.0"/g' {} + 2>/dev/null || true
          find . -name "build.gradle" -exec sed -i "s/install 'pyquery'/install 'cssselect<=1.2.0'\n            install 'pyquery<=2.0.0'/g" {} + 2>/dev/null || true

          # 3. 处理 pyramid 模块
          if [ -f "pyramid/build.gradle" ]; then
            sed -i 's/\(com.chaquo.python:gradle:\)12.0.1/\115.0.1/g' build.gradle 2>/dev/null || true
            sed -i '/buildPython.*python.exe/d' pyramid/build.gradle 2>/dev/null || true
            sed -i 's/minSdkVersion 19/minSdkVersion 21/g' pyramid/build.gradle 2>/dev/null || true
            sed -i 's/minSdkVersion 19/minSdkVersion 21/g' app/build.gradle 2>/dev/null || true
          fi

          # 4. 处理 chaquo 模块
          if [ -f "chaquo/build.gradle" ]; then
            sed -i 's/\(com.chaquo.python:gradle:\)[0-9.]\+/\115.0.1/g' build.gradle 2>/dev/null || true
            sed -i 's/minSdkVersion 19/minSdkVersion 21/g' chaquo/build.gradle 2>/dev/null || true
            sed -i 's/minSdkVersion 19/minSdkVersion 21/g' app/build.gradle 2>/dev/null || true
          fi

          # 5. 移除 x86 架构
          if [ -f "app/build.gradle" ]; then
            sed -i '/x86 {/,/^[[:space:]]*}/d' app/build.gradle 2>/dev/null || true
            if [ "${{ matrix.userName }}" != "FongMi" ]; then
              sed -i 's/applicationId "com\.fongmi\.android\.tv"/applicationId "com.fongmi.tv"/' app/build.gradle 2>/dev/null || true
            fi
          fi

          # 6. 修改 AndroidManifest.xml Provider
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:authorities="com\.fongmi\.quickjs\.provider"/android:authorities="${applicationId}.quickjs.provider"/' app/src/main/AndroidManifest.xml 2>/dev/null || true
          fi

      - name: Compress Source Code
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          tar -cJf source-${{ env.commitS }}.tar.xz --exclude=.git --exclude=.github *

      - name: Release Apk Sign
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          cp -f ${{ github.workspace }}/.github/workflows/TVBoxOSC.jks app/TVBoxOSC.jks
          if [ "${{ matrix.userName }}" == "FongMi" ] && [ "${{ matrix.repoName }}" == "TV" ]; then
            echo "FongMi/TV 使用原生 signingConfigs + local.properties，跳过 build.gradle 注入"
          else
            signingConfigs=''
            signingConfig='ICAgICAgICAgICAgaWYgKHByb2plY3QuaGFzUHJvcGVydHkoIlJFTEVBU0VfU1RPUkVfRklMRSIpKSB7XAogICAgICAgICAgICAgICAgc2lnbmluZ0NvbmZpZyA9IHNpZ25pbmdDb25maWdzLm15Q29uZmlnXAogICAgICAgICAgICB9XAo='
            signingConfigs="$(echo "$signingConfigs" |base64 -d )"
            signingConfig="$(echo "$signingConfig" |base64 -d )"
            sed -i -e "/defaultConfig {/i\\$signingConfigs " -e "/debug {/a\\$signingConfig " -e "/release {/a\\$signingConfig " app/build.gradle
            sed -i '$a\RELEASE_STORE_FILE=./TVBoxOSC.jks'     ./gradle.properties
            sed -i '$a\RELEASE_KEY_ALIAS=TVBoxOSC'            ./gradle.properties
            sed -i '$a\RELEASE_STORE_PASSWORD=TVBoxOSC'       ./gradle.properties
            sed -i '$a\RELEASE_KEY_PASSWORD=TVBoxOSC'         ./gradle.properties
          fi

      - name: Only for FongMi
        if: ${{ matrix.userName == 'FongMi' && env.commit }}
        working-directory: TVBoxOSC
        run: |
          echo "这是 FongMi 的专属定制"
          # 包名修改
          sed -i 's/^.*applicationId "com\.fongmi\.android.*"/    applicationId "com.fongmi.android.tv.yangxiaoge"/' app/build.gradle
          # apk命名增加版本号
          sed -i '/outputFileName.*\.apk"/s/\.apk"/-v${defaultConfig.versionName}.apk"/' app/build.gradle 2>/dev/null || true
          # 代码修改，导包
          sed -i '/public class App/i\
          import java.util.LinkedHashMap;\
          import java.util.Map;\
          import com.fongmi.android.tv.bean.Config;\
          ' app/src/main/java/com/fongmi/android/tv/App.java 2>/dev/null || true
          # 应用名称修改
          if [ -n "${{ github.event.inputs.fongmi_app_name }}" ]; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">${{ github.event.inputs.fongmi_app_name }}</string>|' app/src/main/res/values-zh-rCN/strings.xml 2>/dev/null || true
          else
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">蜂蜜影视</string>|' app/src/main/res/values-zh-rCN/strings.xml 2>/dev/null || true
          fi
          # 代码修改，内置源
          sed -i '/public App()/i\
          private Map<String, String> sourceMap = new LinkedHashMap<>() {{\
              put("自用(个人维护)", "https://cdn.jsdelivr.net/gh/yangxiaoge/tvbox_cust@master/tvbox/self_use.txt");\
              put("饭太硬", "http://www.饭太硬.com/tv");\
              put("ok外部", "http://ok321.top/ok");\
              put("王二小(弹幕)", "http://tvbox.王二小放牛娃.top");\
              put("ok内部(弹幕)", "http://ok321.top/tv");\
          }};\
          ' app/src/main/java/com/fongmi/android/tv/App.java 2>/dev/null || true
          # manifest修改，避免与原版影视provider冲突
          sed -i 's|android:authorities="com\.fongmi\.quickjs\.provider"|android:authorities="com.fongmi.quickjs.provider.yangxiaoge"|' app/src/main/AndroidManifest.xml 2>/dev/null || true
          # 内置源写入数据库
          sed -i '/super\.onCreate();/a\
          // 添加默认接口\n\
          sourceMap.forEach((name, url) -> {\n\
              Config vodConfig = Config.find(url, 0); // 点播\n\
              if (vodConfig.getName() == null || vodConfig.getName().isEmpty()) {\n\
                  vodConfig.setName(name);\n\
                  vodConfig.update();\n\
              }\n\
              Config liveConfig = Config.find(url, 1); // 直播\n\
              if (liveConfig.getName() == null || liveConfig.getName().isEmpty()) {\n\
                  liveConfig.setName(name);\n\
                  liveConfig.update();\n\
              }\n\
          });' app/src/main/java/com/fongmi/android/tv/App.java 2>/dev/null || true
          # 弹幕开关默认开启
          sed -i 's|getBoolean("danmaku_load")|getBoolean("danmaku_load", true)|' app/src/main/java/com/fongmi/android/tv/Setting.java 2>/dev/null || true
          sed -i 's|getBoolean("danmaku_show")|getBoolean("danmaku_show", true)|' app/src/main/java/com/fongmi/android/tv/Setting.java 2>/dev/null || true
          # 移除fongmi版的更新检测代码以及toast提示
          sed -i 's/^\(.*App\.execute.*\)/\/\/ \1/' app/src/leanback/java/com/fongmi/android/tv/Updater.java 2>/dev/null || true
          sed -i 's/^\(.*Notify\.show.*\)/\/\/ \1/' app/src/leanback/java/com/fongmi/android/tv/Updater.java 2>/dev/null || true
          sed -i 's/^\(.*App\.execute.*\)/\/\/ \1/' app/src/mobile/java/com/fongmi/android/tv/Updater.java 2>/dev/null || true
          sed -i 's/^\(.*Notify\.show.*\)/\/\/ \1/' app/src/mobile/java/com/fongmi/android/tv/Updater.java 2>/dev/null || true

      - name: Setup JDK
        if: ${{ env.commit }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdkVersion }}

      - name: Setup Gradle
        if: ${{ env.commit }}
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ "${{ matrix.userName }}" == "FongMi" ] && [ "${{ matrix.repoName }}" == "TV" ]; then
            {
              echo "storeFile=./TVBoxOSC.jks"
              echo "keyAlias=TVBoxOSC"
              echo "storePassword=TVBoxOSC"
            } >> local.properties
          fi

      - name: Build With Gradle
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          chmod +x gradlew
          printf '\n' >> gradle.properties
          for prop in "org.gradle.daemon=true" "org.gradle.parallel=true" "org.gradle.caching=true"; do
            key="${prop%%=*}"
            if grep -q "^${key}=" gradle.properties; then
              sed -i "s|^${key}=.*|${prop}|" gradle.properties
            else
              echo "${prop}" >> gradle.properties
            fi
          done
          ./gradlew assemblerelease --build-cache --parallel --daemon --warning-mode all

      - name: Prepare App
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          rm -rf apk/
          mkdir -p apk/
          find . -type f \( -name "*release*.apk" -o -name "*Release*.apk" \) | while IFS= read -r file; do
            base=$(basename "$file")
            cp "$file" "apk/${{ matrix.userName }}-${{ matrix.repoName }}-${{ matrix.branchName }}-${base}"
          done

      - name: Release Note
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          lastCommit=$(grep "${{ matrix.userName }}\/${{ matrix.repoName }}" ${{ github.workspace }}/README.md | grep -o '[a-z0-9]\{40\}' | head -1)
          if [ -z "$lastCommit" ]; then
            lastCommit=${{ env.commit }}
          fi
          
          export LESSCHARSET=utf-8
          mkdir -p apk/
          echo -e "Credit: [${{ matrix.userName }}](${{ env.upStream }})\nCommit: ${{ env.commit }}\nChangelog:\n\`\`\`" > apk/${{ matrix.userName }}-Release.log
          if [ "${{ env.commit }}" == "${lastCommit}" ]; then
            git log --pretty=format:%B ${{ env.commitS }} -1 | sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' | cat -n | sort -k2,2 -k1,1n | uniq -f1 | sort -k1,1n | cut -f2- >> apk/${{ matrix.userName }}-Release.log
          else
            git log --pretty=format:%B ${{ env.commitS }}...${lastCommit:0:7} | sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' | cat -n | sort -k2,2 -k1,1n | uniq -f1 | sort -k1,1n | cut -f2- >> apk/${{ matrix.userName }}-Release.log
          fi
          echo -e '```' >> apk/${{ matrix.userName }}-Release.log
          if [ ! -s "apk/${{ matrix.userName }}-Release.log" ]; then
            echo "No changes found" >> apk/${{ matrix.userName }}-Release.log
          fi

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        if: ${{ env.commit }}
        with:
          name: ${{ matrix.userName }}-${{ matrix.repoName }}-${{ matrix.branchName }}
          path: |
            TVBoxOSC/apk/*

      - name: Release and Upload Assets
        uses: ncipollo/release-action@v1
        if: ${{ env.commit && !inputs.donotpublish }}
        with:
          name: ${{ matrix.userName }}_${{ matrix.repoName }}_${{ matrix.branchName }}_${{ env.tag }}
          tag: ${{ matrix.userName }}_${{ matrix.repoName }}_${{ matrix.branchName }}_${{ env.tag }}
          bodyFile: TVBoxOSC/apk/${{ matrix.userName }}-Release.log
          allowUpdates: true
          removeArtifacts: false
          artifacts: |
            TVBoxOSC/apk/*.apk
            TVBoxOSC/source-${{ env.commitS }}.*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Older Releases
        uses: dev-drprasad/delete-older-releases@master
        if: ${{ env.commit && !inputs.donotpublish }}
        with:
          keep_latest: 5
          delete_tags: true
          delete_tag_pattern: ${{ matrix.userName }}_${{ matrix.repoName }}_${{ matrix.branchName }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to master
        if: ${{ env.commit }}
        run: |
          rm -rf TVBoxOSC
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git pull --rebase origin master
          
          # 通过 Python 精确更新 README.md 表格
          python3 - << 'PYEOF'
          import re, os
          from datetime import datetime, timezone, timedelta

          tz = timezone(timedelta(hours=8))
          now = datetime.now(tz).strftime('%Y-%m-%d %H:%M:%S')

          user = "${{ matrix.userName }}"
          repo = "${{ matrix.repoName }}"
          branch = "${{ matrix.branchName }}"
          commit = "${{ env.commit }}"
          short_commit = commit[:7] + "..." if len(commit) >= 7 else commit

          readme_path = "README.md"
          if os.path.exists(readme_path):
              with open(readme_path, "r", encoding="utf-8") as f:
                  lines = f.readlines()

              new_lines = []
              for line in lines:
                  if f"{user}/{repo}" in line and "|" in line:
                      parts = [p.strip() for p in line.split("|")]
                      if len(parts) >= 5:
                          parts[2] = branch
                          parts[3] = short_commit
                          parts[4] = now
                          line = f"| {' | '.join(parts[1:5])} |\n"
                  elif line.startswith("*同步数据更新于:"):
                      line = f"*同步数据更新于: {now}*\n"
                  new_lines.append(line)

              with open(readme_path, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)
              print(f"已更新 README 表格: {user}/{repo} -> {short_commit} at {now}")
          PYEOF
          
          git add --all
          if git diff --staged --quiet; then
            echo "没有变动需要提交"
          else
            git commit -m "Update ${{ matrix.userName }}/${{ matrix.repoName }} to ${{ env.commitS }}"
            git push origin master
          fi

  clean:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 5
